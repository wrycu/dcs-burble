[project]
name = "dcs-lso"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "constantly>=23.10.4",
    "pyacmi>=1.2.4",
]

[project.scripts]
dcs-lso = "dcs_lso.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcs_lso"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
